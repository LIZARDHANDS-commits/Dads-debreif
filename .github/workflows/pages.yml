name: Deploy to GitHub Pages

# Every push to main publishes the site, whether or not CI passed: a failing
# check shows as a warning on the CI run, never a stop (Q-T1, "Always
# publish", docs/TESTING.md section 2).
#
# The site stays offline until Patrick picks a public repo or private with
# GitHub Pro (Q-ALL-1, docs/PLAN.md). To turn publishing on:
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables: add PAGES_ON = true.
# Until PAGES_ON is true, this workflow skips itself instead of failing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish; the build job (which runs npm install scripts) can't.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
