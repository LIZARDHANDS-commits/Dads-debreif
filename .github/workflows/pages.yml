name: Deploy to GitHub Pages

# Every push to main publishes the site, whether or not CI passed: a failing
# check shows as a warning on the CI run, never a stop (Q-T1, "Always
# publish", docs/TESTING.md section 2).
#
# Publishing by hand: Actions > Deploy to GitHub Pages > Run workflow. A hand
# run always publishes (Patrick, 5 Oct 2026).
# Publishing on every push to main also needs the Actions variable
# PAGES_ON = true (Settings > Secrets and variables > Actions > Variables);
# until then a push skips this workflow instead of failing.
# Settings > Pages > Build and deployment > Source must be GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish; the build job (which runs npm install scripts) can't.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
