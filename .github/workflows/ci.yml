name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Module sign-off (Patrick, 30 Sep): run by hand from the Actions tab to add
  # the Firefox and WebKit smoke tests to the Chromium run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a run on main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and golden tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build with size budget
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps ${{ github.event_name == 'workflow_dispatch' && 'chromium firefox webkit' || 'chromium' }}
      # Each PR and push runs Chromium only; the manual run adds Firefox and WebKit.
      - name: Browser tests
        run: npm run test:e2e -- ${{ github.event_name != 'workflow_dispatch' && '--project=chromium' || '' }}
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
