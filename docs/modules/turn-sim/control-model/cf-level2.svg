<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 693" width="1288" height="693" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16" y="30" font-size="17" font-weight="bold" fill="#222">Close formation: level 2, each controller</text>
<text x="16" y="50" font-size="12" fill="#555">formation-close-wingman-b2 at 8509fcff: the T29t tidy (482f0857) and the powerFor to powerAsk rename (db651dec). Numbers read from the code's tables.</text>
<rect x="16" y="70" width="410" height="153" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="26" y="87" font-size="12.5" font-weight="bold" fill="#1d2433">#2 point mass</text>
<text x="26" y="100.5" font-size="10.5"  fill="#5a6378">fluid-lead.js stepLead</text>
<text x="26" y="114" font-size="10.5"  fill="#1d2433">Does: G eased at the T-6A onset (T6A_G_ONSET), roll at the asked</text>
<text x="26" y="127.5" font-size="10.5"  fill="#1d2433">rate (fighting wing 60°/s, estimate) within the T-6A's, lift held</text>
<text x="26" y="141" font-size="10.5"  fill="#1d2433">under the stick shaker (the one physical limit), point mass in two</text>
<text x="26" y="154.5" font-size="10.5"  fill="#1d2433">half steps</text>
<text x="26" y="168" font-size="10.5"  fill="#1d2433">Senses: Lift asked (fighting wing); Idle and boards; Lift asked</text>
<text x="26" y="181.5" font-size="10.5"  fill="#1d2433">(close formation)</text>
<text x="26" y="195" font-size="10.5"  fill="#1d2433">Commands: His own state</text>
<text x="26" y="208.5" font-size="10.5"  fill="#1d2433">Numbers (from the code): rollDps 60</text>
<rect x="440" y="70" width="410" height="85.5" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="450" y="87" font-size="12.5" font-weight="bold" fill="#1d2433">Engine</text>
<text x="450" y="100.5" font-size="10.5"  fill="#5a6378">fluid-lead.js engineStep</text>
<text x="450" y="114" font-size="10.5"  fill="#1d2433">Does: Throttle travel in about 0.25 s; 3.5 s spool-up from idle</text>
<text x="450" y="127.5" font-size="10.5"  fill="#1d2433">(handling.js ENGINE, TS-218)</text>
<text x="450" y="141" font-size="10.5"  fill="#1d2433">Senses: Throttle; Idle and boards</text>
<rect x="864" y="70" width="410" height="153" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="874" y="87" font-size="12.5" font-weight="bold" fill="#1d2433">Sight (perceive)</text>
<text x="874" y="100.5" font-size="10.5"  fill="#5a6378">perception.js perceive, seeWith</text>
<text x="874" y="114" font-size="10.5"  fill="#1d2433">Does: The whole picture 0.3 s late: deviation on plane, line,</text>
<text x="874" y="127.5" font-size="10.5"  fill="#1d2433">along; rates (0.1 s); Lead's bank, roll, G dead-reckoned 0.3 s;</text>
<text x="874" y="141" font-size="10.5"  fill="#1d2433">his place's motion as Lead rolls and turns</text>
<text x="874" y="154.5" font-size="10.5"  fill="#1d2433">Senses: Lead as seen (position, velocity, body up); The place he</text>
<text x="874" y="168" font-size="10.5"  fill="#1d2433">aims at</text>
<text x="874" y="181.5" font-size="10.5"  fill="#1d2433">Commands: Deviation (plane, line, along); Deviation rates; Lead's</text>
<text x="874" y="195" font-size="10.5"  fill="#1d2433">bank and G 0.3 s ahead; His place's motion</text>
<text x="874" y="208.5" font-size="10.5"  fill="#1d2433">Numbers (from the code): delaySec 0.3; filterSec 0.1; aheadSec 0.3</text>
<rect x="440" y="167.5" width="410" height="153" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="450" y="184.5" font-size="12.5" font-weight="bold" fill="#1d2433">Supervisor</text>
<text x="450" y="198" font-size="10.5"  fill="#5a6378">supervisor.js supervise, pick, masksFor</text>
<text x="450" y="211.5" font-size="10.5"  fill="#1d2433">Does: On station, small move, large move (plane, line, hinge masks</text>
<text x="450" y="225" font-size="10.5"  fill="#1d2433">eased at 0.5/s), out before up, off station; each with a dead band</text>
<text x="450" y="238.5" font-size="10.5"  fill="#1d2433">Senses: Deviation (plane, line, along); Deviation rates</text>
<text x="450" y="252" font-size="10.5"  fill="#1d2433">Commands: Job and masks</text>
<text x="450" y="265.5" font-size="10.5"  fill="#1d2433">Numbers (from the code): handOverBrakeKtps 1.3; handOverReactSec</text>
<text x="450" y="279" font-size="10.5"  fill="#1d2433">0.3; smallFromFt 1.5; stationFromFt 1; largeFromFt 10; smallBackFt</text>
<text x="450" y="292.5" font-size="10.5"  fill="#1d2433">8; driftFtps 2; driftBackFtps 1.5; underClearFt 2; plhBandFt 2;</text>
<text x="450" y="306" font-size="10.5"  fill="#1d2433">plhPerSec 0.5</text>
<rect x="16" y="235" width="410" height="153" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="26" y="252" font-size="12.5" font-weight="bold" fill="#1d2433">Station change and deconfliction</text>
<text x="26" y="265.5" font-size="10.5"  fill="#5a6378">supervisor.js stationChange, progress, deconflict</text>
<text x="26" y="279" font-size="10.5"  fill="#1d2433">Does: B3: the places a change flies through; never within a</text>
<text x="26" y="292.5" font-size="10.5"  fill="#1d2433">wingspan, ahead of the 3/9 line or with wings overlapping</text>
<text x="26" y="306" font-size="10.5"  fill="#1d2433">Commands: The place he aims at</text>
<text x="26" y="319.5" font-size="10.5"  fill="#1d2433">Numbers (from the code): offStation.paceFtps 8;</text>
<text x="26" y="333" font-size="10.5"  fill="#1d2433">offStation.intoEchelonFtps 5; offStation.flowFt 5;</text>
<text x="26" y="346.5" font-size="10.5"  fill="#1d2433">offStation.flowKt 5; offStation.doneFt 1.5; offStation.doneFtps</text>
<text x="26" y="360" font-size="10.5"  fill="#1d2433">1.5; deconflict.noseTailDeadFt 2; deconflict.lookAheadSec 1;</text>
<text x="26" y="373.5" font-size="10.5"  fill="#1d2433">deconflict.spanDeadFt 2; deconflict.aheadDeadFt 5</text>
<rect x="864" y="235" width="410" height="99" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="874" y="252" font-size="12.5" font-weight="bold" fill="#1d2433">Holding power (feed-forward)</text>
<text x="874" y="265.5" font-size="10.5"  fill="#5a6378">close-formation.js holdingTorque</text>
<text x="874" y="279" font-size="10.5"  fill="#1d2433">Does: powerFor at the briefed 200 KIAS + his place's speed, his G,</text>
<text x="874" y="292.5" font-size="10.5"  fill="#1d2433">Lead's climb, his place's climb and his own climb</text>
<text x="874" y="306" font-size="10.5"  fill="#1d2433">Senses: His place's motion</text>
<text x="874" y="319.5" font-size="10.5"  fill="#1d2433">Commands: Holding power</text>
<rect x="440" y="332.5" width="410" height="99" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="450" y="349.5" font-size="12.5" font-weight="bold" fill="#1d2433">Power lead (feed-forward)</text>
<text x="450" y="363" font-size="10.5"  fill="#5a6378">close-formation.js powerLeadPct</text>
<text x="450" y="376.5" font-size="10.5"  fill="#1d2433">Does: Torque for his place's acceleration along Lead's nose as</text>
<text x="450" y="390" font-size="10.5"  fill="#1d2433">Lead's turn builds or eases</text>
<text x="450" y="403.5" font-size="10.5"  fill="#1d2433">Senses: His place's motion</text>
<text x="450" y="417" font-size="10.5"  fill="#1d2433">Commands: Power lead</text>
<rect x="864" y="346" width="410" height="180" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="874" y="363" font-size="12.5" font-weight="bold" fill="#1d2433">Three axes (closeLaw)</text>
<text x="874" y="376.5" font-size="10.5"  fill="#5a6378">close-formation.js closeLaw; core pilotAxis</text>
<text x="874" y="390" font-size="10.5"  fill="#1d2433">Does: Pace cascade (0.4 ft/s per ft, at most 8 ft/s, the braking</text>
<text x="874" y="403.5" font-size="10.5"  fill="#1d2433">taper), then P and D per axis: plane G 0.04/0.06, line bank 1.9°</text>
<text x="874" y="417" font-size="10.5"  fill="#1d2433">per ft/s, hinge torque 12% per ft/s; I 0</text>
<text x="874" y="430.5" font-size="10.5"  fill="#1d2433">Senses: Deviation (plane, line, along); Deviation rates; Job and</text>
<text x="874" y="444" font-size="10.5"  fill="#1d2433">masks; Holding power; Power lead; Corrections given</text>
<text x="874" y="457.5" font-size="10.5"  fill="#1d2433">Commands: Corrections wanted</text>
<text x="874" y="471" font-size="10.5"  fill="#1d2433">Numbers (from the code): plane.kp 0.04; plane.kd 0.06; plane.ki 0;</text>
<text x="874" y="484.5" font-size="10.5"  fill="#1d2433">plane.iMax 0; kPosPerSec 0.4; side.kdDegPerFtps 1.9; side.ki 0;</text>
<text x="874" y="498" font-size="10.5"  fill="#1d2433">side.iMax 0; fore.kdPctPerFtps 12; fore.ki 0; fore.iMax 0; deadFt</text>
<text x="874" y="511.5" font-size="10.5"  fill="#1d2433">0; deadFtps 0; paceFtps 8; brakeTorquePct 20</text>
<rect x="16" y="400" width="410" height="261" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="26" y="417" font-size="12.5" font-weight="bold" fill="#1d2433">Shaper (the hand)</text>
<text x="26" y="430.5" font-size="10.5"  fill="#5a6378">shaper.js shape</text>
<text x="26" y="444" font-size="10.5"  fill="#1d2433">Does: Pressure sizes per job, eased between jobs; torque rate 10</text>
<text x="26" y="457.5" font-size="10.5"  fill="#1d2433">or 20%/s, 20%/s × reach in a telegraph; the trims held at a limit</text>
<text x="26" y="471" font-size="10.5"  fill="#1d2433">Senses: Job and masks; Holding power; Corrections wanted</text>
<text x="26" y="484.5" font-size="10.5"  fill="#1d2433">Commands: Throttle; Corrections given</text>
<text x="26" y="498" font-size="10.5"  fill="#1d2433">Numbers (from the code): boardsBelowPct 10; telegraphTorquePctps</text>
<text x="26" y="511.5" font-size="10.5"  fill="#1d2433">20; jobs.onStation.gCap 0.3; jobs.onStation.bankCapDeg 5;</text>
<text x="26" y="525" font-size="10.5"  fill="#1d2433">jobs.onStation.torqueCapPct 10; jobs.onStation.torquePctps 10;</text>
<text x="26" y="538.5" font-size="10.5"  fill="#1d2433">jobs.smallMove.gCap 0.3; jobs.smallMove.bankCapDeg 5;</text>
<text x="26" y="552" font-size="10.5"  fill="#1d2433">jobs.smallMove.torqueCapPct 10; jobs.smallMove.torquePctps 10;</text>
<text x="26" y="565.5" font-size="10.5"  fill="#1d2433">jobs.largeMove.gCap 0.5; jobs.largeMove.bankCapDeg 15;</text>
<text x="26" y="579" font-size="10.5"  fill="#1d2433">jobs.largeMove.torqueCapPct 100; jobs.largeMove.torquePctps 20;</text>
<text x="26" y="592.5" font-size="10.5"  fill="#1d2433">jobs.outBeforeUp.gCap 0.5; jobs.outBeforeUp.bankCapDeg 15;</text>
<text x="26" y="606" font-size="10.5"  fill="#1d2433">jobs.outBeforeUp.torqueCapPct 100; jobs.outBeforeUp.torquePctps</text>
<text x="26" y="619.5" font-size="10.5"  fill="#1d2433">20; jobs.offStation.gCap 0.5; jobs.offStation.bankCapDeg 15;</text>
<text x="26" y="633" font-size="10.5"  fill="#1d2433">jobs.offStation.torqueCapPct 100; jobs.offStation.torquePctps 20;</text>
<text x="26" y="646.5" font-size="10.5"  fill="#1d2433">capsPerSec.g 0.5; capsPerSec.bankDeg 10; capsPerSec.torquePct 30</text>
<rect x="440" y="443.5" width="410" height="126" rx="6" fill="#f7f9fb" stroke="#9aa4b5"/>
<text x="450" y="460.5" font-size="12.5" font-weight="bold" fill="#1d2433">Lift (liftFor)</text>
<text x="450" y="474" font-size="10.5"  fill="#5a6378">close-formation.js liftFor</text>
<text x="450" y="487.5" font-size="10.5"  fill="#1d2433">Does: Lead's lift at his G and bank 0.3 s ahead + his place's</text>
<text x="450" y="501" font-size="10.5"  fill="#1d2433">motion + the corrections; roll catch-up 0.6 of the gap</text>
<text x="450" y="514.5" font-size="10.5"  fill="#1d2433">Senses: Lead's bank and G 0.3 s ahead; His place's motion;</text>
<text x="450" y="528" font-size="10.5"  fill="#1d2433">Corrections given</text>
<text x="450" y="541.5" font-size="10.5"  fill="#1d2433">Commands: Lift asked (close formation)</text>
<text x="450" y="555" font-size="10.5"  fill="#1d2433">Numbers (from the code): rollCatchUp 0.6</text>
</svg>