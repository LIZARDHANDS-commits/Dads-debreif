<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ui-kit test page</title>
    <link rel="stylesheet" href="/src/ui-kit/tokens.css">
    <link rel="stylesheet" href="/src/ui-kit/base.css">
    <style>
      body { display: grid; grid-template-columns: 20rem 1fr; gap: 1rem; padding: 1rem; }
      #stage { width: 600px; height: 400px; border: 1px solid var(--border); }
      #side { display: grid; gap: 1rem; grid-column: 2; }
      #settings { grid-column: 1; }
      #side canvas { width: 300px; height: 150px; border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <main id="controls"></main>
    <div id="stage"><canvas id="map"></canvas></div>
    <div id="side"><canvas id="replay"></canvas><canvas id="chart"></canvas></div>
    <aside id="settings"></aside>
    <script type="module">
      // A page for the browser tests of controls.js and canvas-view.js, loaded
      // straight from src/ (tests/e2e/ui-kit.spec.js).
      import { createStore } from '/src/storage/store.js';
      import { createSettings } from '/src/storage/settings.js';
      import { createScheduler } from '/src/ui-kit/scheduler.js';
      import { createControls, VIEW_DEFAULT, VIEW_ALLOWED } from '/src/ui-kit/controls.js';
      import { createCanvasView, createCanvasSurface } from '/src/ui-kit/canvas-view.js';
      import { createSettingsMenu } from '/src/ui-kit/settings-menu.js';

      const settings = createSettings(
        createStore(null).scope('kit'),
        { bubbleFt: 1000, opacity: 0.5, grid: true, trail: 60, view: VIEW_DEFAULT, turnG: 4 },
        { allowed: { view: VIEW_ALLOWED } },
      );
      const controls = createControls(settings);
      document.getElementById('controls').append(
        controls.number('bubbleFt', { label: 'Safety bubble', unit: 'ft', min: 100, max: 5000, step: 50 }),
        controls.slider('opacity', { label: 'Chart opacity', min: 0, max: 1, step: 0.05, format: (v) => `${Math.round(v * 100)}%` }),
        controls.checkbox('grid', { label: '5,000 ft grid' }),
        controls.select('trail', { label: 'Trail', options: [[0, 'Full'], [60, 'Last 60 s']] }),
        controls.viewSwitch(),
      );

      // The Settings menu a module keeps its tuning numbers in (starts closed).
      let resets = 0;
      const menu = createSettingsMenu({ title: 'Turn settings', onReset: () => { resets++; settings.reset(); } });
      menu.section('Turn').append(controls.number('turnG', { label: 'Turn G', unit: 'G', min: 1, max: 6, step: 0.5 }));
      document.getElementById('settings').append(menu.element);

      const scheduler = createScheduler();
      let draws = 0;
      let userMoves = 0;
      const view = createCanvasView(document.getElementById('map'), {
        timers: scheduler.scope('map'),
        minSpan: 500,
        maxSpan: 300000,
        label: 'Test map',
        onUserMove: () => userMoves++,
        draw(ctx, v) {
          draws++;
          const [x, y] = v.worldToScreen(0, 0);
          ctx.fillStyle = '#42bfe9';
          ctx.fillRect(x - 5, y - 5, 10, 10);
        },
      });
      view.fit({ minX: -5000, minY: -5000, maxX: 5000, maxY: 5000 }, 0);

      // A map that leaves the arrows to the page, as the debrief does for playback.
      const replay = createCanvasView(document.getElementById('replay'), {
        timers: scheduler.scope('replay'),
        label: 'Replay map',
        arrowKeys: false,
        draw() {},
      });
      // What app.keys does: skip keys something else already handled.
      const shortcuts = [];
      document.addEventListener('keydown', (e) => {
        if (!e.defaultPrevented && e.key.startsWith('Arrow')) shortcuts.push(e.key);
      });

      // A sharp canvas without pan and zoom, like the EM chart.
      let chartDraws = 0;
      const chart = createCanvasSurface(document.getElementById('chart'), {
        timers: scheduler.scope('chart'),
        label: 'Test chart',
        draw(ctx, surface) {
          chartDraws++;
          ctx.fillRect(0, 0, surface.size.width / 2, 10);
        },
      });

      window.__kit = {
        settings,
        controls,
        view,
        replay,
        chart,
        menu,
        resets: () => resets,
        shortcuts: () => shortcuts.slice(),
        chartDraws: () => chartDraws,
        draws: () => draws,
        userMoves: () => userMoves,
        stats: () => scheduler.stats(),
      };
    </script>
  </body>
</html>
