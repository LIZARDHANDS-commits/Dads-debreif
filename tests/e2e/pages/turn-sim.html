<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turn Sim test page</title>
    <link rel="stylesheet" href="/src/ui-kit/tokens.css">
    <link rel="stylesheet" href="/src/ui-kit/base.css">
    <style>
      /* Stands in for the shell's header, so the module gets the same room as on the site. */
      #bar { height: var(--header-height); padding: 0 var(--space-3); display: flex; align-items: center; border-bottom: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <header id="bar">Turn Sim test page <span id="module-status" role="status" hidden style="margin-left: 1rem"></span></header>
    <main id="view"></main>
    <!-- The site's build bundles three.js; straight from src/ the bare name needs a map to the installed copy. -->
    <script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
    <script type="module">
      // Mounts the Turn Sim on the real host, scheduler, store and standards, straight from src/,
      // so its browser tests don't wait for its entry in the shell's registry (tests/e2e/turn-sim.spec.js).
      import { createStore, browserStorage } from '/src/storage/store.js';
      import { createSettings } from '/src/storage/settings.js';
      import { createStandards } from '/src/storage/standards.js';
      import { createScheduler } from '/src/ui-kit/scheduler.js';
      import { createHost } from '/src/shell/host.js';
      import { createTime } from '/src/shell/header.js';

      const store = createStore(browserStorage);
      const settings = createSettings(store.scope('app'), { timePrimary: 'zulu', motion: 'system' });
      const standards = createStandards({ store: store.scope('standards') });
      const scheduler = createScheduler();
      const time = createTime({ settings, zone: () => 'America/Regina' });
      const statusLine = document.getElementById('module-status');
      const host = createHost({
        root: document.getElementById('view'), scheduler, store, settings, time, standards,
        onStatus: (text) => { statusLine.textContent = text; statusLine.hidden = !text; },
      });
      const entry = { id: 'turn-sim', title: 'Formation Turn Sim', load: () => import('/src/modules/turn-sim/index.js') };

      window.__ts = {
        host,
        scheduler,
        standards,
        open: () => host.open(entry),
        close: () => host.close(),
        stats: () => ({ ...host.stats(), ...scheduler.stats() }),
      };
      await window.__ts.open();
      window.__tsReady = true;
    </script>
  </body>
</html>
