<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formation flight plots (dev)</title>
  <link rel="stylesheet" href="../../node_modules/uplot/dist/uPlot.min.css">
  <style>
    /* A development page only (Formation plan Step 12.1c): never part of the built site (vite.config.js builds index.html only). */
    :root { --bg: #0d1117; --panel: #161b22; --ink: #e3eef5; --muted: #8b98a5; --rule: #2a3642; --accent: #4fc3f7; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid var(--rule); }
    h1 { font-size: 16px; margin: 0 12px 0 0; }
    label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
    select, input[type="file"] { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; }
    main { padding: 8px 16px 32px; display: grid; gap: 14px; }
    .chart { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; }
    .chart h2 { font-size: 13px; margin: 2px 6px 4px; color: var(--muted); font-weight: 600; }
    .note { color: var(--muted); padding: 0 16px; margin: 6px 0 0; }
    .u-legend { color: var(--ink); }
  </style>
</head>
<body>
  <header>
    <h1>Formation flight plots</h1>
    <label>Run <select id="run"></select></label>
    <label>Or a trace file <input id="file" type="file" accept=".json"></label>
  </header>
  <p class="note" id="note">Run <code>node tools/formation-gauge.mjs</code> first; its traces are in <code>tmp/gauge/</code>. Dashed lines mark each press. Drag on a chart to zoom, double-click to zoom out.</p>
  <main id="charts"></main>
  <script type="module" src="./main.js"></script>
</body>
</html>
