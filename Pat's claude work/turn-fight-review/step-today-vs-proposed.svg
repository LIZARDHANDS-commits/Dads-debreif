<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="20" y="34" font-size="22" font-weight="bold">One 0.02 s Energy step: today, and the proposed shape</text>
  <text x="20" y="56" fill="#555">Left: energy-sim.js stepOnce today (call order). Right: proposed refactor (option B). Red = problem, green = change.</text>

  <!-- TODAY -->
  <rect x="20" y="76" width="660" height="664" rx="8" fill="#f7f9fc" stroke="#1565c0"/>
  <text x="36" y="102" font-size="17" font-weight="bold">Today</text>
  <g>
    <rect x="40" y="116" width="620" height="44" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="136">1. Before the pass: both fly straight (flyStraight). At the pass: startTurns picks each jet's</text>
    <text x="52" y="153">first move from the plan made at T+0 (Auto race or Tactical dry runs, 0.5-1 s).</text>
    <rect x="40" y="170" width="620" height="62" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="190">2. stepAircraft (Blue, then Red, each reads the other from before the step):</text>
    <text x="52" y="208">   move ended? -> hand to MPT, or Auto re-pick. Over 60 s? -> re-pick.</text>
    <text x="52" y="226">   MPT and Tactical: every 3.5 s fly 7 copies of the fight 20 s ahead, maybe switch.</text>
    <rect x="40" y="242" width="620" height="44" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="262">3. controlFor(mode): one of 8 controllers returns G, bank, throttle. Each has its own</text>
    <text x="52" y="279">   phase strings ('main', 'roll', 'pull', 'dive', 'apex' ...) and sets c.next when done.</text>
    <rect x="40" y="296" width="620" height="80" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="316">4. Limits: G to the shaker, STALL (1 G for 1 s), OVER G flag. Bank moves toward its target</text>
    <text x="52" y="333">   at 90 deg/s (30 % when stalled).</text>
    <text x="52" y="352" fill="#c62828">   G is applied as asked: 1.9 to 5.0 G in one step. Roll rate goes 0 to 90 deg/s in one</text>
    <text x="52" y="368" fill="#c62828">   step. Position stays smooth; the nose and wings snap.</text>
    <rect x="40" y="386" width="620" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="52" y="406">5. core stepPointMass (RK4) moves the jet; thrust minus drag from core. Speed floor 15 kt.</text>
    <text x="52" y="423">   Tumbling jets skip this and use a separate home-made ballistic step.</text>
    <rect x="40" y="440" width="620" height="80" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="460">6. readPair (range, ATA, AA, HCA), checkFirstNose: first nose-on, and every jet whose nose</text>
    <text x="52" y="477">   is on (or Tactical advantage, or the 60 deg canopy rule) starts pursuit for the rest of</text>
    <text x="52" y="494">   the fight. aimPoint: collision avoidance (85 ft offset) only inside pursuit.</text>
    <text x="52" y="511" fill="#c62828">   Pursuit never ends; MPT has no avoidance.</text>
    <rect x="40" y="530" width="620" height="44" rx="6" fill="#fff" stroke="#888"/>
    <text x="52" y="550">7. checkWezGun: 2 s inside 2,500 ft, ATA 15, AA 60 = kill. checkMidAirCollision: under</text>
    <text x="52" y="567">   35 ft = collision and tumble.</text>
    <text x="52" y="604" font-weight="bold">Measured on main (traces.md):</text>
    <text x="52" y="624">- Auto: 3 of 3 runs end in a mid-air collision (both chase head-on).</text>
    <text x="52" y="642">- Tactical, equal jets at 140 or 180 KIAS: no nose-on in 240 s; moves flip</text>
    <text x="52" y="660">  pitch back / slice every 4-7 s, then level MPT at the deck.</text>
    <text x="52" y="678">- 300 KIAS: both pursue each other for 220 s, no kill.</text>
    <text x="52" y="696">- No position jump anywhere (largest 0.01 ft).</text>
    <text x="52" y="714">- Up to ~200 G/s and ~1,500 deg/s2 of pitch acceleration at move changes.</text>

  </g>

  <!-- PROPOSED -->
  <rect x="720" y="76" width="660" height="664" rx="8" fill="#f6fbf6" stroke="#2e7d32"/>
  <text x="736" y="102" font-size="17" font-weight="bold">Proposed (option B: refactor the decision layer)</text>
  <rect x="740" y="116" width="620" height="80" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="752" y="136" font-weight="bold">1. pilot.js: the one place a move is chosen</text>
  <text x="752" y="154">At decision points only (move finished, nose-on gained or lost, threat, every few s):</text>
  <text x="752" y="172">Auto (SMM table) or Tactical (look-ahead) picks the next move. Pursuit is a move</text>
  <text x="752" y="190">like any other and can end. Same rules for both jets, one log of "why".</text>
  <rect x="740" y="206" width="620" height="62" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="752" y="226" font-weight="bold">2. moves/: one small file per move</text>
  <text x="752" y="244">enter(jet), control(jet, other) -> wanted G, bank, throttle; done(jet). No move</text>
  <text x="752" y="262">switches itself; it only says "done". Pitch back, slice, Immelmann, split S, MPT ...</text>
  <rect x="740" y="278" width="620" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="752" y="298" font-weight="bold">3. pilot-inputs: one smoothing layer for every move</text>
  <text x="752" y="316">G changes at a set onset rate; roll eases in and out (core easeRoll). Because every</text>
  <text x="752" y="334">move goes through it, every hand-over is smooth by construction: G, roll rate and</text>
  <text x="752" y="352">flight path match at each boundary. Numbers: Patrick's ruling (card).</text>
  <rect x="740" y="368" width="620" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="752" y="388" font-weight="bold">4. core stepPointMass (unchanged), one integrator, also for the tumble</text>
  <text x="752" y="405">Flags, not walls: STALL, OVER G, top speed, below hard deck (plan Step 2).</text>
  <rect x="740" y="422" width="620" height="62" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="752" y="442" font-weight="bold">5. judge.js: nose-on, chase, gun kill, collision</text>
  <text x="752" y="460">Shared with the Simple fight (one nose-on rule, one 3D off-nose angle). Collision</text>
  <text x="752" y="478">avoidance is a pilot rule at all times, not only in pursuit.</text>
  <rect x="740" y="494" width="620" height="62" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="752" y="514" font-weight="bold">6. lookahead.js: cheap and off the frame</text>
  <text x="752" y="532">Flies only the two jets (no readouts), short horizon, a time budget, spread over</text>
  <text x="752" y="550">frames. No 1 s wait on Reset, no hitch every 3.5 s.</text>
  <rect x="740" y="566" width="620" height="44" rx="6" fill="#fff" stroke="#2e7d32"/>
  <text x="752" y="586" font-weight="bold">7. One defaults table, one version label, core formulas only</text>
  <text x="752" y="603">rollToward, dampedClimbG, bankDegFromG, pitchDegFromClimb from core.</text>
  <text x="752" y="640" font-weight="bold">Kept as is:</text>
  <text x="752" y="660">core point-mass and T-6 performance, the screens, 2D, 3D, graph, presets,</text>
  <text x="752" y="678">start geometry, the Simple circles fight, settings storage.</text>
  <text x="752" y="704" font-weight="bold">Not used from Traffic:</text>
  <text x="752" y="722">path-follower and the Hermite join (TF-R25: free physics, no planned paths).</text>
</svg>
