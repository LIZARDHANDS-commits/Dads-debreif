<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="860" height="430" fill="#fff"/><g font-family="sans-serif" font-size="12"><rect x="10" y="10" width="220" height="410" fill="none" stroke="#999"/><text x="18" y="28" font-weight="bold">LEFT: buttons</text><text x="18" y="48" font-weight="bold">Change formation (new)</text><rect x="18" y="56" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="72" fill="#000">Line abreast</text><rect x="120" y="56" width="100" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="128" y="72" fill="#000">Fighting wing</text><rect x="18" y="86" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="102" fill="#000">Echelon</text><rect x="120" y="86" width="100" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="128" y="102" fill="#000">Fluid manoeuv.</text><rect x="18" y="116" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="132" fill="#000">Route</text><text x="122" y="133" font-size="11">Side: Keep | L | R</text><text x="18" y="160" font-size="11" fill="#555">+ More: Line astern, rejoin options</text><text x="18" y="176" font-size="11" fill="#555">  (4-ship adds Finger, Box, Spread 4,</text><text x="18" y="190" font-size="11" fill="#555">   Offset box when 4 aircraft exist)</text><text x="18" y="214" font-weight="bold">Manoeuvres (as V2.6)</text><rect x="18" y="222" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="238" fill="#000">Delayed 90</text><rect x="120" y="222" width="100" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="128" y="238" fill="#000">Delayed 45</text><rect x="18" y="252" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="268" fill="#000">Check 20</text><rect x="120" y="252" width="100" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="128" y="268" fill="#000">In place 90</text><rect x="18" y="282" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="298" fill="#000">Hook</text><rect x="120" y="282" width="100" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="128" y="298" fill="#000">Shackle</text><rect x="18" y="312" width="96" height="24" rx="4" fill="#e8eef7" stroke="#889"/><text x="26" y="328" fill="#000">Cross turn</text><text x="18" y="350" font-size="11">Setup: Spacing, #2 on Lead's (unchanged)</text><text x="18" y="366" font-size="11">220 KIAS . 8,000 ft . 3 G . still air</text><rect x="240" y="10" width="360" height="410" fill="#f7fbff" stroke="#999"/><text x="250" y="28" font-weight="bold">CENTRE: the picture (as V2.6)</text><text x="250" y="48" font-size="11">Both paths drawn dashed ahead; a range ring</text><text x="250" y="62" font-size="11">and closure arrow show only during a rejoin.</text><rect x="610" y="10" width="240" height="410" fill="none" stroke="#999"/><text x="618" y="28" font-weight="bold">RIGHT: Formation card</text><text x="618" y="50" >Now: Line abreast, right</text><text x="618" y="66" >Flying: LAB to Echelon right (hot turning rejoin)</text><text x="618" y="90" font-size="11">Lead 200 KIAS  30 deg  1.2 G</text><text x="618" y="104" font-size="11">#2   215 KIAS  42 deg  1.3 G</text><text x="618" y="128" font-weight="bold">Rejoin (only while rejoining)</text><text x="618" y="144" font-size="11">Range 2,400 ft  Closure 14 kt</text><text x="618" y="158" font-size="11">Lead at 1:30   Line: ON LINE</text><text x="618" y="172" font-size="11">Height: 40 ft below Lead  (OK)</text><text x="618" y="200" font-weight="bold">When established, judged:</text><text x="618" y="216" font-size="11">Echelon right: ON STATION</text><text x="618" y="230" font-size="11">lateral 44 ft  aft 27 ft  down 6 ft</text><text x="618" y="254" font-size="11">Other states: LAB on spacing / wide / tight / fore / aft;</text><text x="618" y="268" font-size="11">FW range and sweep in band; route 1-3 spans</text><text x="618" y="396" font-size="10" fill="#777">Numbers shown are examples, not results.</text></g></svg>