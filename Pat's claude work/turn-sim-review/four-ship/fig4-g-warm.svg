<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="640" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="20" y="28" fill="#1f2430" font-size="16" font-weight="700" text-anchor="start">G-warm from Spread 4 (SMM 16.22 paras 70-71, 16.44 para 120, Fig 16.35; AFM8 p.16)</text><text x="20" y="48" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Top view, 6,000 ft between neighbours, all four fly the same thing. Times and the dip are ESTIMATES (my arithmetic at 220 KIAS, 248 KTAS, 8,000 ft).</text><rect x="20" y="70" width="275" height="330" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="30" y="90" fill="#1f2430" font-size="12.5" font-weight="700" text-anchor="start">1 Stand-by</text><text x="30" y="107" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">PCL max, fuel check, 220 KIAS minimum</text><text x="30" y="121" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">heading north, #2 on the left</text><g transform="translate(124,280) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="138" y="284" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(52,280) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="66" y="284" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(196,280) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="210" y="284" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(268,280) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="282" y="284" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="310" y="70" width="275" height="330" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="320" y="90" fill="#1f2430" font-size="12.5" font-weight="700" text-anchor="start">2 In place 90 toward #2 (3 G)</text><text x="320" y="107" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">about 12 deg/s: roughly 8 s</text><text x="320" y="121" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">now heading west: #2 first, #4 last, 3 NM long</text><g transform="translate(414,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="414" y="266" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(342,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="342" y="266" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(486,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="486" y="266" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(558,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="558" y="266" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="600" y="70" width="275" height="330" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="610" y="90" fill="#1f2430" font-size="12.5" font-weight="700" text-anchor="start">3 Push over 1/2 G, 5 s, then level</text><text x="610" y="107" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">about 400 ft lower, all four alike</text><text x="610" y="121" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">"Lead sees wingman level", then the hook</text><g transform="translate(704,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="704" y="266" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(632,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="632" y="266" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(776,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="776" y="266" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(848,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="848" y="266" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="890" y="70" width="275" height="330" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="900" y="90" fill="#1f2430" font-size="12.5" font-weight="700" text-anchor="start">4 Hook away (4 G), then 90 back</text><text x="900" y="107" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">about 17 deg/s: hook 11 s; then in place 90</text><text x="900" y="121" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">grey: before the hook; heading east after it</text><g transform="translate(994,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d0d4dc"/></g><g transform="translate(994,246.184) rotate(90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="994" y="232.184" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(922,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d0d4dc"/></g><g transform="translate(922,246.184) rotate(90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="922" y="232.184" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(1066,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d0d4dc"/></g><g transform="translate(1066,246.184) rotate(90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="1066" y="232.184" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(1138,280) rotate(-90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d0d4dc"/></g><g transform="translate(1138,246.184) rotate(90) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="1138" y="232.184" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><line x1="1110" y1="280" x2="1110" y2="246.184" stroke="#697080" stroke-width="1" marker-end="url(#ar)"/><text x="1116" y="260" fill="#697080" font-size="10" font-weight="400" text-anchor="start">2,800 ft over (4 G hook diameter)</text><text x="20" y="440" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Sequence and a first-cut timeline in seconds (estimate); the stack stays throughout</text><rect x="20" y="454" width="185.9120879120879" height="44" rx="4" fill="#cfd8e3" stroke="#697080" stroke-width="0.8"/><text x="24" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">stand-by</text><text x="24" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">15 s</text><rect x="207.9120879120879" y="454" width="98.21978021978022" height="44" rx="4" fill="#f2c9a8" stroke="#697080" stroke-width="0.8"/><text x="211.9120879120879" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">90, 3 G</text><text x="211.9120879120879" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">8 s</text><rect x="308.13186813186815" y="454" width="123.27472527472527" height="44" rx="4" fill="#c9e4c5" stroke="#697080" stroke-width="0.8"/><text x="312.13186813186815" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">push 1/2 G</text><text x="312.13186813186815" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">10 s</text><rect x="433.4065934065934" y="454" width="135.8021978021978" height="44" rx="4" fill="#f2c9a8" stroke="#697080" stroke-width="0.8"/><text x="437.4065934065934" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">hook 4 G</text><text x="437.4065934065934" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">11 s</text><rect x="571.2087912087912" y="454" width="48.10989010989011" height="44" rx="4" fill="#cfd8e3" stroke="#697080" stroke-width="0.8"/><text x="575.2087912087912" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">calls</text><text x="575.2087912087912" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">4 s</text><rect x="621.3186813186813" y="454" width="98.21978021978022" height="44" rx="4" fill="#f2c9a8" stroke="#697080" stroke-width="0.8"/><text x="625.3186813186813" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">90 back, 3 G</text><text x="625.3186813186813" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">8 s</text><rect x="721.5384615384615" y="454" width="436.46153846153845" height="44" rx="4" fill="#e5d4f5" stroke="#697080" stroke-width="0.8"/><text x="725.5384615384615" y="472" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">tighten LAB to 4,000 ft</text><text x="725.5384615384615" y="488" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">35 s</text><text x="20" y="530" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">About 90 s in all. G: 3, then 1/2 for 5 s, then 4, then 3 (SMM 16.22 para 71). Fuel and tank balance are called first (Orders B2 ch 8, formation R/T).</text><text x="20" y="548" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">All players "fly accurate G and headings" and keep separation from the aircraft ahead (SMM 16.44 para 120). Then "tighten LAB spacing, closer to 4,000 ft" (AFM8 p.16 item 5):</text><text x="20" y="566" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">#2 and #3 close 2,000 ft on Lead and #4 closes 2,000 ft on #3 (a 10 degree heading change, about 30 s each; estimate).</text><text x="20" y="584" fill="#697080" font-size="12" font-weight="400" text-anchor="start">In the 2-ship the same sequence flies from line abreast with #2 only (SMM 16.22 paras 70-71): one builder serves both.</text></svg>