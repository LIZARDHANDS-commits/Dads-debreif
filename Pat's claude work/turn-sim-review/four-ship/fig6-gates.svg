<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="600" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="20" y="28" fill="#1f2430" font-size="16" font-weight="700" text-anchor="start">Who moves when: the manuals' "wait for the one ahead" rules become start times (estimate of durations)</text><text x="20" y="48" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Gates: SMM 16.32 para 86, AFM7 p.18 item 2d, SMM 16.34 para 96. Durations are ESTIMATES (2-ship slide rate, about 5 kt = 8 ft/s).</text><text x="20" y="80" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Finger to echelon, same side (SMM 16.32 para 87)</text><text x="20" y="112" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><text x="20" y="142" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><text x="20" y="172" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="70" y="128" width="74.19047619047619" height="22" rx="4" fill="#2e7d32" fill-opacity="0.22" stroke="#2e7d32" stroke-width="0.5"/><text x="74" y="143" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">out, back, down</text><rect x="70" y="158" width="74.19047619047619" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="74" y="173" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">with #3</text><rect x="127.14285714285714" y="98" width="207.52380952380952" height="22" rx="4" fill="#d1561a" fill-opacity="0.22" stroke="#d1561a" stroke-width="0.5"/><text x="131.14285714285714" y="113" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">crosses behind and below</text><rect x="336.6666666666667" y="128" width="74.19047619047619" height="22" rx="4" fill="#2e7d32" fill-opacity="0.22" stroke="#2e7d32" stroke-width="0.5"/><text x="340.6666666666667" y="143" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">regain</text><rect x="336.6666666666667" y="158" width="74.19047619047619" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="340.6666666666667" y="173" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">regain</text><text x="1090" y="190" fill="#697080" font-size="11" font-weight="400" text-anchor="end">about 40 s</text><text x="20" y="210" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Finger to box (SMM 16.32 para 91)</text><text x="20" y="242" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><text x="20" y="272" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><text x="20" y="302" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="70" y="288" width="150.38095238095238" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="74" y="303" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">back and down, behind #3</text><rect x="222.38095238095238" y="288" width="93.23809523809524" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="226.38095238095238" y="303" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">loose line astern</text><rect x="317.6190476190476" y="288" width="112.28571428571428" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="321.6190476190476" y="303" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">power: normal line astern</text><text x="1090" y="320" fill="#697080" font-size="11" font-weight="400" text-anchor="end">about 40 s</text><text x="20" y="340" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Rejoin from FW to finger, straight ahead (AFM7 p.18 item 2; SMM 16.34 para 95)</text><text x="20" y="372" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><text x="20" y="402" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><text x="20" y="432" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="70" y="358" width="378.95238095238096" height="22" rx="4" fill="#d1561a" fill-opacity="0.22" stroke="#d1561a" stroke-width="0.5"/><text x="74" y="373" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">to route, stack kept</text><rect x="450.95238095238096" y="358" width="140.85714285714286" height="22" rx="4" fill="#d1561a" fill-opacity="0.22" stroke="#d1561a" stroke-width="0.5"/><text x="454.95238095238096" y="373" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">stack off, echelon</text><rect x="317.6190476190476" y="388" width="378.95238095238096" height="22" rx="4" fill="#2e7d32" fill-opacity="0.22" stroke="#2e7d32" stroke-width="0.5"/><text x="321.6190476190476" y="403" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">to route</text><rect x="698.5714285714286" y="388" width="140.85714285714286" height="22" rx="4" fill="#2e7d32" fill-opacity="0.22" stroke="#2e7d32" stroke-width="0.5"/><text x="702.5714285714286" y="403" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">echelon</text><rect x="565.2380952380952" y="418" width="378.95238095238096" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="569.2380952380952" y="433" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">to route</text><rect x="946.1904761904761" y="418" width="112.28571428571428" height="22" rx="4" fill="#8a2be2" fill-opacity="0.22" stroke="#8a2be2" stroke-width="0.5"/><text x="950.1904761904761" y="433" fill="#1f2430" font-size="10.5" font-weight="400" text-anchor="start">echelon</text><text x="1090" y="450" fill="#697080" font-size="11" font-weight="400" text-anchor="end">about 100 s</text><text x="20" y="470" fill="#697080" font-size="12" font-weight="400" text-anchor="start">A gate is "the aircraft ahead has finished its leg": known from the plan, not sensed, so the next one starts at that planned time.</text><text x="20" y="488" fill="#697080" font-size="12" font-weight="400" text-anchor="start">If a leg cannot be solved, nothing starts and the card says which aircraft is the problem.</text></svg>