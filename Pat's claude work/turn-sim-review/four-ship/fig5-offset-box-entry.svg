<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="560" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="20" y="28" fill="#1f2430" font-size="16" font-weight="700" text-anchor="start">Offset box via Fluid 4 (AFM8 pp.20-22; SMM 16.41 paras 109-110)</text><text x="20" y="48" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Top view, Lead up in every frame; each frame has its own scale. Spacings are the briefs'; the box depth is TS-18's 7,000 ft; FW offsets are ESTIMATES.</text><rect x="20" y="70" width="275" height="360" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="30" y="90" fill="#1f2430" font-size="12" font-weight="700" text-anchor="start">1 Fighting wing</text><text x="30" y="107" fill="#697080" font-size="10" font-weight="400" text-anchor="start">"FLUID 4, GO"</text><text x="30" y="120" fill="#697080" font-size="10" font-weight="400" text-anchor="start">#2 side set; #3, #4 opposite</text><g transform="translate(168.3,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="178.8" y="164" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(214.3,206) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="224.8" y="210" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(158,238.5) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="168.5" y="242.5" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(101.69999999999999,271) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="112.19999999999999" y="275" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="310" y="70" width="275" height="360" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="320" y="90" fill="#1f2430" font-size="12" font-weight="700" text-anchor="start">2 Fluid 4</text><text x="320" y="107" fill="#697080" font-size="10" font-weight="400" text-anchor="start">#3 diverges to 6,000 ft (wide LAB) on Lead</text><text x="320" y="120" fill="#697080" font-size="10" font-weight="400" text-anchor="start">#2 and #4 stay in FW, outside</text><g transform="translate(538,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="548.5" y="164" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(551.8,173.8) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="562.3" y="177.8" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(358,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="368.5" y="164" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(344.2,173.8) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="354.7" y="177.8" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="600" y="70" width="275" height="360" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="610" y="90" fill="#1f2430" font-size="12" font-weight="700" text-anchor="start">3 In place 90 (both pairs turn in FW)</text><text x="610" y="107" fill="#697080" font-size="10" font-weight="400" text-anchor="start">"FOR OFFSET BOX RIGHT, IN PLACE 90 RIGHT"</text><text x="610" y="120" fill="#697080" font-size="10" font-weight="400" text-anchor="start">the pairs end 6,000 ft apart in trail</text><g transform="translate(731.1,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="741.6" y="164" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(744.9,173.8) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="755.4" y="177.8" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(731.1,340) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="741.6" y="344" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(744.9,353.79999999999995) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="755.4" y="357.79999999999995" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><rect x="890" y="70" width="275" height="360" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="900" y="90" fill="#1f2430" font-size="12" font-weight="700" text-anchor="start">4 Elements spread to LAB: offset box</text><text x="900" y="107" fill="#697080" font-size="10" font-weight="400" text-anchor="start">#3 in the slot, #4 outside #2; trail 7,000</text><text x="900" y="120" fill="#697080" font-size="10" font-weight="400" text-anchor="start">#3 calls "IN" when ready to manoeuvre</text><g transform="translate(938,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="948.5" y="164" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(1058,160) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="1068.5" y="164" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(998,300) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="1008.5" y="304" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(1118,300) rotate(0) scale(0.7)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="1128.5" y="304" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><text x="20" y="460" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">Why this entry: the briefs build the offset box from fighting wing through Fluid 4 (AFM8 pp.20-22). The SMM also allows it from finger on the call</text><text x="20" y="478" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">"OFFSET BOX EAST/WEST", with the manoeuvring "as briefed" (SMM 16.41 para 110). The stack goes on once each aircraft is in position (AFM8 p.20 item 4):</text><text x="20" y="496" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">#2 +300, Lead 0, #3 -300, #4 -600 ft. Left or right box is the same, mirrored (AFM8 p.22). Frame 3 to 4 is the longest step: two lateral moves of about</text><text x="20" y="514" fill="#697080" font-size="12" font-weight="400" text-anchor="start">6,000 ft (a 10 degree heading change takes about 30 s per 2,000 ft, estimate), so roughly 1.5 to 2 minutes (estimate).</text></svg>