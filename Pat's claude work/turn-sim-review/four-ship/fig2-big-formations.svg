<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" width="1180" height="940" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="940" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="20" y="28" fill="#1f2430" font-size="16" font-weight="700" text-anchor="start">The big formations (top view, Lead flies up; each panel has its own scale) and the altitude stack</text><text x="20" y="48" fill="#697080" font-size="12" font-weight="400" text-anchor="start">My own drawing. FW offsets (#2 at 45 deg sweep, #3 and #4 at 30, range 650 ft) are ESTIMATES. Spacing, trail and stack are the manuals'.</text><rect x="20" y="70" width="560" height="275" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="30" y="90" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Spread 4 (SMM 16.42 para 113; AFM8 p.15)</text><text x="30" y="107" fill="#697080" font-size="11" font-weight="400" text-anchor="start">4,000-6,000 ft between neighbours; start on 6,000 (wide)</text><line x1="222" y1="155" x2="66" y2="155" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="222" y1="155" x2="378" y2="155" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="378" y1="155" x2="534" y2="155" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><g transform="translate(222,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="235.5" y="159" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(66,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="79.5" y="159" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(378,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="391.5" y="159" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(534,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="547.5" y="159" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><line x1="34" y1="328" x2="190" y2="328" stroke="#1f2430" stroke-width="2"/><text x="196" y="332" fill="#697080" font-size="11" font-weight="400" text-anchor="start">6,000 ft</text><rect x="600" y="70" width="560" height="275" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="610" y="90" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Offset box (SMM 16.41 para 109; AFM8 pp.20-22)</text><text x="610" y="107" fill="#697080" font-size="11" font-weight="400" text-anchor="start">rear element 6,000-8,000 ft back (default 7,000); #3 in the slot, #4 outside #2</text><line x1="979" y1="155" x2="847" y2="155" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="979" y1="155" x2="913" y2="309" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="913" y1="309" x2="781" y2="309" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><g transform="translate(979,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="992.5" y="159" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(847,155) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="860.5" y="159" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(913,309) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="926.5" y="313" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(781,309) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="794.5" y="313" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><line x1="614" y1="328" x2="746" y2="328" stroke="#1f2430" stroke-width="2"/><text x="752" y="332" fill="#697080" font-size="11" font-weight="400" text-anchor="start">6,000 ft</text><rect x="20" y="360" width="560" height="275" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="30" y="380" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Fluid 4 (AFM8 p.20): two fighting-wing pairs abreast</text><text x="30" y="397" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#3 at wide LAB (6,000 ft) on Lead; #2 and #4 in fighting wing on the outside</text><line x1="450" y1="445" x2="473" y2="468" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="450" y1="445" x2="150" y2="445" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="150" y1="445" x2="127" y2="468" stroke="#b8c0cc" stroke-width="1.2" stroke-dasharray="4 4"/><g transform="translate(450,445) rotate(0) scale(0.9)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="463.5" y="449" fill="#1c5fa8" font-size="12" font-weight="700" text-ancho