<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="700" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="20" y="28" fill="#1f2430" font-size="16" font-weight="700" text-anchor="start">Lean screen with four aircraft (the 2-ship screen plus the 4-ship buttons)</text><text x="20" y="48" fill="#697080" font-size="12" font-weight="400" text-anchor="start">My own mock-up. Nothing new appears with two aircraft. V6 has no formation-change buttons, so nothing of V6's moves or goes.</text><rect x="20" y="70" width="300" height="600" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="32" y="92" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Change formation (4-ship)</text><rect x="32" y="102" width="130" height="30" rx="6" fill="#fde9d8" stroke="#d1561a" stroke-width="2"/><text x="97" y="122" fill="#1f2430" font-size="12" font-weight="700" text-anchor="middle">Spread 4 (here)</text><rect x="172" y="102" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="122" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Fighting wing</text><rect x="32" y="138" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="158" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Fluid 4</text><rect x="172" y="138" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="158" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Fluid manoeuv.</text><rect x="32" y="174" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="194" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Offset box</text><rect x="172" y="174" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="194" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Finger</text><rect x="32" y="210" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="230" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Echelon</text><rect x="172" y="210" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="230" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Box</text><text x="32" y="262" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Side: Keep | L | R</text><text x="32" y="280" fill="#697080" font-size="11" font-weight="400" text-anchor="start">More: Line astern, Route, Rejoin type,</text><text x="32" y="294" fill="#697080" font-size="11" font-weight="400" text-anchor="start">stack on/off, overtake KIAS, box depth</text><text x="32" y="326" fill="#1f2430" font-size="12" font-weight="700" text-anchor="start">Manoeuvres (for the formation you are in)</text><rect x="32" y="338" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="358" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Delayed 90</text><rect x="172" y="338" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="358" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Delayed 45</text><rect x="32" y="374" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="394" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Check 20</text><rect x="172" y="374" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="394" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">In place 90</text><rect x="32" y="410" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="97" y="430" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">Hook</text><rect x="172" y="410" width="130" height="30" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1"/><text x="237" y="430" fill="#1f2430" font-size="12" font-weight="400" text-anchor="middle">G-warm</text><text x="32" y="458" fill="#697080" font-size="11" font-weight="400" text-anchor="start">In fighting wing: Lead's FW buttons (level turn,</text><text x="32" y="472" fill="#697080" font-size="11" font-weight="400" text-anchor="start">wings level, climb, descend, terminate). In fluid</text><text x="32" y="486" fill="#697080" font-size="11" font-weight="400" text-anchor="start">manoeuvring: the FM set (60/2 turn, wingover, roll).</text><text x="32" y="508" fill="#697080" font-size="11" font-weight="400" text-anchor="start">Greyed with a reason when they do not apply:</text><text x="32" y="522" fill="#697080" font-size="11" font-weight="400" text-anchor="start">G-warm only in Spread 4; no shackle or cross turn</text><text x="32" y="536" fill="#697080" font-size="11" font-weight="400" text-anchor="start">in a four-ship (SMM 16.43 para 118; TS-16).</text><text x="32" y="568" fill="#b26a00" font-size="11" font-weight="400" text-anchor="start">Appear only with four aircraft: Spread 4, Fluid 4,</text><text x="32" y="582" fill="#b26a00" font-size="11" font-weight="400" text-anchor="start">Offset box, Finger, Box, G-warm.</text><rect x="340" y="70" width="500" height="600" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="352" y="92" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Plan view (follow camera, 3/9 line, planned paths)</text><g transform="translate(390,330) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="404" y="334" fill="#d1561a" font-size="12" font-weight="700" text-anchor="start">#2</text><g transform="translate(500,330) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="514" y="334" fill="#1c5fa8" font-size="12" font-weight="700" text-anchor="start">Lead</text><g transform="translate(610,330) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#2e7d32"/></g><text x="624" y="334" fill="#2e7d32" font-size="12" font-weight="700" text-anchor="start">#3</text><g transform="translate(720,330) rotate(0) scale(1)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#8a2be2"/></g><text x="734" y="334" fill="#8a2be2" font-size="12" font-weight="700" text-anchor="start">#4</text><line x1="380" y1="350" x2="800" y2="350" stroke="#697080" stroke-width="1" stroke-dasharray="3 4"/><text x="386" y="366" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start">3/9 line</text><text x="352" y="420" fill="#697080" font-size="11" font-weight="400" text-anchor="start">Close formations: the camera zooms in below about 1,000 ft</text><text x="352" y="436" fill="#697080" font-size="11" font-weight="400" text-anchor="start">(transitions design question 8), so finger, echelon and box can be read.</text><text x="352" y="470" fill="#697080" font-size="11" font-weight="400" text-anchor="start">Rejoin or station change in flight: the card's gate line says</text><text x="352" y="486" fill="#697080" font-size="11" font-weight="400" text-anchor="start">"waiting on #2" and the plan view shows each leg dashed.</text><text x="352" y="630" fill="#697080" font-size="11" font-weight="400" text-anchor="start">One fixed line: 220 KIAS - 8,000 ft - 3 G turns - stack</text><text x="352" y="646" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#2 +300, Lead 0, #3 -300, #4 -600 (AFM8 p.14) - version label</text><rect x="860" y="70" width="300" height="600" rx="8" fill="none" stroke="#d9dde3" stroke-width="1.2"/><text x="872" y="92" fill="#1f2430" font-size="13" font-weight="700" text-anchor="start">Formation card</text><text x="872" y="118" fill="#1f2430" font-size="11" font-weight="600" text-anchor="start">Now: Spread 4, #2 on the left</text><text x="872" y="138" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">Flying: Spread 4 to Fighting wing (TRJ)</text><text x="872" y="178" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">#2 off Lead  4,980 ft abeam, sweep 1 deg</text><text x="872" y="198" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">#3 off Lead  5,020 ft abeam, sweep 0 deg</text><text x="872" y="218" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">#4 off #3    5,010 ft abeam, sweep 2 deg</text><text x="872" y="238" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">Heights vs Lead: +300 / -300 / -600 ft</text><text x="872" y="278" fill="#b26a00" font-size="11" font-weight="600" text-anchor="start">Gates: #2 stable ok | #3 closing | #4 waits</text><text x="872" y="298" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">Rejoin: range 2,300 ft, closure 18 kt,</text><text x="872" y="318" fill="#1f2430" font-size="11" font-weight="400" text-anchor="start">  Lead at 10:30, ON LINE; below Lead ok</text><text x="872" y="358" fill="#697080" font-size="11" font-weight="400" text-anchor="start">Judged on roll-out, each link:</text><text x="872" y="378" fill="#2e7d32" font-size="11" font-weight="600" text-anchor="start">#2 IN BAND (620 ft, 41 deg)</text><text x="872" y="398" fill="#b26a00" font-size="11" font-weight="600" text-anchor="start">#3 TOO FAR (1,240 ft)</text><text x="872" y="418" fill="#2e7d32" font-size="11" font-weight="600" text-anchor="start">#4 off #3 IN BAND</text><text x="872" y="458" fill="#697080" font-size="11" font-weight="400" text-anchor="start">Lead 200 KIAS 30 deg 1.2 G</text><text x="872" y="478" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#2 215 KIAS 45 deg 1.4 G</text><text x="872" y="498" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#3 218 KIAS 38 deg 1.3 G</text><text x="872" y="518" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#4 220 KIAS 20 deg 1.1 G</text><text x="872" y="650" fill="#697080" font-size="10.5" font-weight="400" text-anchor="start" font-style="italic">Example numbers only (drawn, not flown).</text></svg>