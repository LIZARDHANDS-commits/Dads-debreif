<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1180" height="760" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="24" y="30" fill="#1f2430" font-size="16" font-weight="600" text-anchor="start">How it flies: both aircraft on one flight model, Lead on a script, the wingman on a pursuit controller</text><text x="24" y="50" fill="#697080" font-size="13" font-weight="400" text-anchor="start">Recommendation (c). Names in bold are existing code to reuse (src/core); the rest is new.</text><text x="40" y="90" fill="#1c5fa8" font-size="14" font-weight="700" text-anchor="start">LEAD</text><rect x="40" y="100" width="330" height="100" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="50" y="120" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Lead button</text><text x="50" y="140" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">Level turn, reversal, climb/descend, wingover,</text><text x="50" y="156" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">barrel roll, loop, power change, terminate</text><text x="50" y="172" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">one press = one script, planned at the press</text><rect x="40" y="230" width="330" height="110" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="50" y="250" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Lead script (open loop)</text><text x="50" y="270" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">bank target, G target, power for each manoeuvre</text><text x="50" y="286" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">level hold: dampedClimbG (core)</text><text x="50" y="302" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">dry-run on a copy draws the planned path (as today)</text><rect x="40" y="370" width="330" height="130" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="50" y="390" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Smoothing, the same chain for both</text><text x="50" y="410" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">roll: easeRoll, 90 deg/s, 360 deg/s^2 (TS-37)</text><text x="50" y="426" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">G: the same easeRoll, onset limit (estimate 4 G/s)</text><text x="50" y="442" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">power: first-order lag (estimate 1.5 s)</text><text x="50" y="458" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">G never above the shaker line (physical)</text><rect x="40" y="530" width="330" height="110" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="50" y="550" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Point mass: stepPointMass (core)</text><text x="50" y="570" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">thrust minus drag from the T-6A fit (core)</text><text x="50" y="586" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">speed bleeds in turns, 3-D, loops and wingovers</text><text x="50" y="602" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">one model for Lead and wingman</text><line x1="205" y1="200" x2="205" y2="230" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><line x1="205" y1="340" x2="205" y2="370" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><line x1="205" y1="500" x2="205" y2="530" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><text x="450" y="90" fill="#d1561a" font-size="14" font-weight="700" text-anchor="start">WINGMAN (live, each step)</text><rect x="450" y="100" width="380" height="100" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="460" y="120" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">1  Slot: where I want to be</text><text x="460" y="140" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">range, sweep, side, stack from the settings</text><text x="460" y="156" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">collapses toward Lead’s six as Lead banks harder</text><text x="460" y="172" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">moves smoothly (estimate 2 s), side changes cross behind</text><rect x="450" y="230" width="380" height="110" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="460" y="250" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">2  Pursuit: how I get there</text><text x="460" y="270" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">velocity wanted = slot velocity + catch-up to the slot</text><text x="460" y="286" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">plus Lead’s own turn rate (“do what Lead did”)</text><text x="460" y="302" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">lift vector placed on it: G and bank from the aim</text><rect x="450" y="370" width="380" height="130" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="460" y="390" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">3  Pilot layer</text><text x="460" y="410" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">reaction lag (estimate 0.3 s) on G, bank, power</text><text x="460" y="426" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">G ceiling 5 (SMM 16.17 para 44a) as an aim, flagged</text><text x="460" y="442" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">FM: power copied from Lead. FW: wingman trims power</text><text x="460" y="458" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">bubble guard: a smooth push back, never a switch</text><line x1="640" y1="200" x2="640" y2="230" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><line x1="640" y1="340" x2="640" y2="370" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><line x1="370" y1="585" x2="450" y2="585" stroke="#697080" stroke-width="1"/><line x1="640" y1="500" x2="640" y2="560" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><text x="650" y="530" fill="#697080" font-size="12" font-weight="400" text-anchor="start">same smoothing chain</text><rect x="450" y="560" width="380" height="80" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="460" y="580" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Smoothing + point mass (same code as Lead)</text><text x="460" y="600" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">wingman G and bank leave the controller already</text><text x="460" y="616" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">limited, so it cannot jerk the way the Fight Sim does</text><line x1="370" y1="285" x2="450" y2="150" stroke="#1c5fa8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="372" y="215" fill="#1c5fa8" font-size="12" font-weight="400" text-anchor="start">Lead state</text><text x="900" y="90" fill="#2e7d32" font-size="14" font-weight="700" text-anchor="start">JUDGE (reads, never steers)</text><rect x="900" y="100" width="250" height="250" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="910" y="120" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Formation card</text><text x="910" y="140" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">in cone / stretched / tight</text><text x="910" y="156" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">range, angle off tail, side</text><text x="910" y="172" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">aspect, HCA, closure</text><text x="910" y="188" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">pursuit now: lead, pure, lag</text><text x="910" y="204" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">bubble, 5 G, aspect+HCA flags</text><text x="910" y="220" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">terminate suggested (a flag)</text><text x="910" y="236" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">wingman and Lead KIAS, G, bank</text><line x1="830" y1="300" x2="900" y2="250" stroke="#1f2430" stroke-width="1.5" marker-end="url(#ar)"/><rect x="900" y="380" width="250" height="120" rx="6" fill="#f5f7fa" stroke="#1f2430" stroke-width="1.2"/><text x="910" y="400" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Failure and stale data</text><text x="910" y="420" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">no position: card shows dashes</text><text x="910" y="436" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">stall: G falls to the shaker line</text><text x="910" y="452" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">NaN: hold last good, say so</text><text x="40" y="700" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Not new: stepPointMass, t6aExcessFn, easeRoll, dampedClimbG, shakerG, iasToTasKt. Asked of the core owner (nothing touched here): export the</text><text x="40" y="718" fill="#697080" font-size="12" font-weight="400" text-anchor="start">stabilised-up helper (upFrom in point-mass.js), and a shared excess-power-at-throttle function (energy-sim.js excessFnFor).</text></svg>