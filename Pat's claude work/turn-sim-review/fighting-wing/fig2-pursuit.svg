<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1300" height="620" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="24" y="30" fill="#1f2430" font-size="16" font-weight="600" text-anchor="start">Staying on Lead’s turn circle, and the three pursuit curves (schematic, my own drawing)</text><text x="24" y="50" fill="#697080" font-size="13" font-weight="400" text-anchor="start">SMM 16.16 paras 39-40 and Figs 16.9, 16.10; SMM 12.30 paras 72-74 and Fig 12.24; EFIG p.391.</text><circle cx="260" cy="300" r="130" fill="none" stroke="#697080" stroke-dasharray="5 4"/><text x="260" y="304" fill="#697080" font-size="12" font-weight="400" text-anchor="middle">Lead’s</text><text x="260" y="320" fill="#697080" font-size="12" font-weight="400" text-anchor="middle">turn circle</text><g transform="translate(343.5623892592501,200.41422239453286) rotate(130)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><g transform="translate(176.4376107407499,200.41422239453286) rotate(50)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="359.5623892592501" y="194.41422239453286" fill="#1c5fa8" font-size="13" font-weight="600" text-anchor="start">Lead</text><text x="138.4376107407499" y="190.41422239453286" fill="#d1561a" font-size="13" font-weight="600" text-anchor="start">#2</text><line x1="176.4376107407499" y1="200.41422239453286" x2="343.5623892592501" y2="200.41422239453286" stroke="#1f2430" stroke-width="1.2" stroke-dasharray="3 3"/><text x="24" y="86" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Same circle, same turn rate: the line of sight does not move.</text><text x="24" y="104" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Aspect = X, heading crossing angle = 2 X, closure about 0 (SMM Fig 16.10).</text><text x="24" y="480" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">Here the arc between them is 80 deg, so aspect 40 deg and HCA 80 deg.</text><text x="24" y="498" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">This is what the wingman holds while Lead turns steadily.</text><text x="24" y="524" fill="#697080" font-size="12" font-weight="400" text-anchor="start">A check a pilot would recognise: on a steady turn, HCA is about twice the aspect.</text><text x="580" y="86" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Three ways to point the nose, from the same spot (SMM 12.30 paras 72-74)</text><path d="M820 300 q 40 -40 60 -120" fill="none" stroke="#1c5fa8" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#ar)"/><g transform="translate(820,300) rotate(0)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="838" y="304" fill="#1c5fa8" font-size="13" font-weight="600" text-anchor="start">Lead (turning right)</text><g transform="translate(1000,440) rotate(0)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="1018" y="446" fill="#d1561a" font-size="13" font-weight="600" text-anchor="start">#2</text><line x1="1000" y1="422" x2="860" y2="200" stroke="#d1561a" stroke-width="2" marker-end="url(#ar)"/><text x="850" y="186" fill="#d1561a" font-size="12" font-weight="600" text-anchor="middle">LEAD pursuit: nose in front of Lead (inside its circle)</text><line x1="1000" y1="422" x2="824" y2="308" stroke="#7a8a3a" stroke-width="2" marker-end="url(#ar)"/><text x="800" y="332" fill="#7a8a3a" font-size="12" font-weight="600" text-anchor="end">PURE: nose on Lead</text><line x1="1000" y1="422" x2="790" y2="420" stroke="#5b4a9b" stroke-width="2" marker-end="url(#ar)"/><text x="780" y="446" fill="#5b4a9b" font-size="12" font-weight="600" text-anchor="end">LAG pursuit: nose behind Lead (outside its circle)</text><text x="580" y="540" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">Lead: most closure, aspect up (use when too far back).   Pure: closure, line of sight zero.</text><text x="580" y="558" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">Lag: less closure, aspect down (use when too close). Lead pursuit flies inside Lead’s circle, lag outside it (EFIG p.391).</text><text x="580" y="576" fill="#697080" font-size="12" font-weight="400" text-anchor="start">In the sim these are readouts: the controller steers to the slot and the screen names what the nose is doing.</text><text x="580" y="594" fill="#697080" font-size="12" font-weight="400" text-anchor="start">“Go where Lead was, do what Lead did” (EFIG p.391) is the rule it flies by.</text></svg>