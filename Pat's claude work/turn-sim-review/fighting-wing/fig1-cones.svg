<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="660" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2430"/></marker></defs><text x="24" y="30" fill="#1f2430" font-size="16" font-weight="600" text-anchor="start">Where the wingman sits: fighting wing wedge and fluid manoeuvring cone (top view, Lead up)</text><text x="24" y="50" fill="#697080" font-size="13" font-weight="400" text-anchor="start">My own drawing. Ranges and angles from SMM 12.29 para 69 / Fig 12.19, SMM 16.17 paras 42 and 44, AFM7 brief p.14 and p.17, EFIG p.391.</text><path d="M160 250 A180 180 0 0 0 520 250" fill="none" stroke="#697080" stroke-dasharray="4 4"/><text x="346" y="444" fill="#697080" font-size="12" font-weight="400" text-anchor="start">500 ft</text><path d="M-20 250 A360 360 0 0 0 700 250" fill="none" stroke="#697080" stroke-dasharray="4 4"/><text x="346" y="624" fill="#697080" font-size="12" font-weight="400" text-anchor="start">1000 ft</text><path d="M160.00000000000003 561.7691453623979 A360 360 0 0 1 28.23085463760208 430 L184.11542731880104 340 A180 180 0 0 0 250 405.88457268119896 z" fill="#f2c9a8" fill-opacity="0.35" stroke="none" stroke-width="1"/><path d="M520 561.7691453623979 A360 360 0 0 0 651.7691453623979 430 L495.88457268119896 340 A180 180 0 0 1 430 405.88457268119896 z" fill="#f2c9a8" fill-opacity="0.95" stroke="#d1561a" stroke-width="1"/><path d="M160.00000000000003 561.7691453623979 A360 360 0 0 0 520 561.7691453623979 L430 405.88457268119896 A180 180 0 0 1 250 405.88457268119896 z" fill="#b9d7ee" fill-opacity="0.7" stroke="#1c5fa8" stroke-width="1"/><path d="M340 250 L651.7691453623979 430 M340 250 L28.23085463760208 430" stroke="#1c5fa8" stroke-dasharray="6 5" fill="none"/><circle cx="340" cy="250" r="180" fill="none" stroke="#b3261e" stroke-width="2"/><line x1="340" y1="250" x2="340" y2="624.4" stroke="#697080" stroke-width="1" stroke-dasharray="2 4"/><text x="344" y="638.4" fill="#697080" font-size="12" font-weight="400" text-anchor="start">Lead’s six o’clock</text><line x1="20" y1="250" x2="660" y2="250" stroke="#697080" stroke-width="1" stroke-dasharray="2 4"/><text x="24" y="244" fill="#697080" font-size="12" font-weight="400" text-anchor="start">3/9 line</text><g transform="translate(340,250) rotate(0)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#1c5fa8"/></g><text x="358" y="246" fill="#1c5fa8" font-size="13" font-weight="600" text-anchor="start">Lead</text><g transform="translate(518.1909088590099,428.19090885901) rotate(0)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="534.1909088590099" y="432.19090885901" fill="#d1561a" font-size="13" font-weight="600" text-anchor="start">#2 FW</text><g transform="translate(386.78013043399585,470.08321016510627) rotate(0)"><path d="M0 -13 L3 -3 L13 3 L13 6 L3 4 L2 11 L6 13 L6 15 L0 14 L-6 15 L-6 13 L-2 11 L-3 4 L-13 6 L-13 3 L-3 -3 z" fill="#d1561a"/></g><text x="402.78013043399585" y="474.08321016510627" fill="#d1561a" font-size="13" font-weight="600" text-anchor="start">#2 FM</text><rect x="676" y="86" width="336" height="402" rx="6" fill="#f5f7fa" stroke="#d9dde3" stroke-width="1.2"/><text x="690" y="110" fill="#1f2430" font-size="13" font-weight="600" text-anchor="start">Reading the picture</text><rect x="690" y="128" width="22" height="14" fill="#f2c9a8" fill-opacity="0.95" stroke="#697080"/><text x="722" y="140" fill="#1f2430" font-size="13" font-weight="400" text-anchor="start">Fighting wing position</text><text x="722" y="156" fill="#697080" font-size="12" font-weight="400" text-anchor="start">30 to 60 deg off Lead’s tail, 500 to 1,000 ft</text><text x="722" y="172" fill="#697080" font-size="11" font-weight="400" text-anchor="start">SMM 12.29 para 69; EFIG p.391</text><rect x="690" y="194" width="22" height="14" fill="#b9d7ee" fill-opacity="0.8" stroke="#697080"/><text x="722" y="206" fill="#1f2430" font-size="13" font-weight="400" text-anchor="start">Fluid manoeuvring cone (my reading)</text><text x="722" y="222" fill="#697080" font-size="12" font-weight="400" text-anchor="start">60 deg wide in all (30 either side of the tail)</text><text x="722" y="238" fill="#697080" font-size="11" font-weight="400" text-anchor="start">SMM 16.17 para 42; 500-1,000 ft, work toward</text><text x="722" y="252" fill="#697080" font-size="11" font-weight="400" text-anchor="start">500-750 ft (AFM7 p.17, AFM8 p.19)</text><line x1="690" y1="278" x2="712" y2="278" stroke="#1c5fa8" stroke-dasharray="6 5"/><text x="722" y="282" fill="#1f2430" font-size="13" font-weight="400" text-anchor="start">Other reading: 60 deg either side</text><text x="722" y="298" fill="#b3261e" font-size="12" font-weight="600" text-anchor="start">Question 1 for Patrick</text><line x1="690" y1="324" x2="712" y2="324" stroke="#b3261e" stroke-width="2"/><text x="722" y="328" fill="#1f2430" font-size="13" font-weight="400" text-anchor="start">500 ft bubble, always</text><text x="722" y="344" fill="#697080" font-size="11" font-weight="400" text-anchor="start">SMM 16.17 para 44c; Gen Book p.11</text><text x="690" y="378" fill="#1f2430" font-size="12" font-weight="600" text-anchor="start">Why I read the cone as 60 deg wide in all</text><text x="690" y="396" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">SMM 16.17 para 42 says the 30-60 swept position</text><text x="690" y="412" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">would be outside the fluid parameters. A cone</text><text x="690" y="428" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">60 deg either side would contain it. A cone 30</text><text x="690" y="444" fill="#1f2430" font-size="12" font-weight="400" text-anchor="start">either side leaves it just outside. (Inference.)</text><text x="690" y="462" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#2 FW is drawn at 45 deg and 700 ft,</text><text x="690" y="476" fill="#697080" font-size="11" font-weight="400" text-anchor="start">#2 FM at 12 deg and 625 ft.</text></svg>