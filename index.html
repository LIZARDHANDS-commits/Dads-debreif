<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="DAD's OODA LOOP: T-6 formation debrief, turn and traffic simulators, and SOF weather tools.">
    <meta name="theme-color" content="#020a10">
    <title>DAD's OODA LOOP</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="./src/ui-kit/tokens.css">
    <link rel="stylesheet" href="./src/ui-kit/base.css">
    <link rel="stylesheet" href="./src/shell/shell.css">
    <link rel="stylesheet" href="./src/airfields/airfields.css">
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="app-header">
      <a class="brand" href="#/">DAD's OODA LOOP <span class="version-badge">V2.54</span></a>
      <nav class="app-nav" aria-label="Main">
        <a href="#/">Home</a>
        <a href="#/about">About</a>
      </nav>
      <div class="app-clock" id="app-clock" aria-live="off" hidden></div>
      <div class="app-actions">
        <button type="button" id="open-settings">Settings</button>
        <a class="button" id="report-problem" href="#" target="_blank" rel="noopener noreferrer">Report a problem</a>
      </div>
    </header>
    <p class="narrow-note" id="narrow-note">This tool is laid out for screens 1280 px or wider; some panels may overlap.</p>
    <p class="notice route-notice" id="route-notice" role="status" hidden></p>
    <main id="view" tabindex="-1"></main>
    <p class="status-line" id="module-status" role="status" aria-live="polite" hidden></p>
    <footer class="app-footer">
      <span id="app-updated">Development copy</span>
      <a href="https://github.com/LIZARDHANDS-commits/Dads-debreif" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
    </footer>
    <noscript><p class="notice">DAD's OODA LOOP needs JavaScript turned on.</p></noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
